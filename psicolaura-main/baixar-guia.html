<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baixe o Guia Gratuito | Laura Breitschaft — Psicóloga em Jundiaí</title>
    <meta name="description" content="Baixe gratuitamente o guia 5 Sinais de que é Hora de Buscar Ajuda Profissional. Um guia rápido da psicóloga Laura Breitschaft.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        .capture-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--cor-fundo) 0%, var(--cor-fundo-intermediario) 100%);
            padding: 2rem 1.5rem;
        }

        .capture-card {
            max-width: 480px;
            width: 100%;
            background: var(--cor-card);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            box-shadow: var(--sombra-card-hover);
            border: 1px solid rgba(233, 223, 212, 0.5);
            padding: 3rem 2.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .capture-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--gradiente-cta);
        }

        .capture-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, rgba(176, 137, 104, 0.15), rgba(176, 137, 104, 0.05));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }

        .capture-icon svg {
            width: 36px;
            height: 36px;
            color: var(--cor-destaque);
        }

        .capture-card h1 {
            font-family: var(--fonte-titulo);
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--cor-texto-principal);
            line-height: 1.3;
            margin-bottom: 0.8rem;
        }

        .capture-card > p {
            font-size: 0.95rem;
            color: var(--cor-texto-secundario);
            line-height: 1.7;
            margin-bottom: 2rem;
        }

        .capture-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .capture-form input[type="text"],
        .capture-form input[type="email"] {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 2px solid var(--cor-borda);
            border-radius: 12px;
            font-family: var(--fonte-corpo);
            font-size: 0.95rem;
            color: var(--cor-texto-principal);
            background: rgba(255, 255, 255, 0.6);
            transition: border-color 0.3s ease;
            box-sizing: border-box;
        }

        .capture-form input:focus {
            outline: none;
            border-color: var(--cor-destaque);
        }

        .capture-form input::placeholder {
            color: var(--cor-texto-secundario);
            opacity: 0.6;
        }

        .capture-form button {
            width: 100%;
            padding: 1rem;
            background: var(--gradiente-cta);
            background-size: 200% 100%;
            color: white;
            border: none;
            border-radius: 12px;
            font-family: var(--fonte-corpo);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transicao-suave);
            box-shadow: var(--sombra-botao);
        }

        .capture-form button:hover {
            background-position: 100% 0;
            transform: translateY(-2px);
            box-shadow: var(--sombra-botao-hover);
        }

        .capture-privacy {
            font-size: 0.8rem;
            color: var(--cor-texto-secundario);
            opacity: 0.6;
            margin-top: 1rem;
            line-height: 1.5;
        }

        .capture-privacy a {
            color: var(--cor-destaque);
            text-decoration: none;
        }

        .capture-skip {
            display: inline-block;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--cor-texto-secundario);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .capture-skip:hover {
            color: var(--cor-destaque);
        }

        @media (max-width: 500px) {
            .capture-card {
                padding: 2.5rem 1.8rem;
            }
            .capture-card h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>

<body>
    <div class="capture-page">
        <div class="capture-card">
            <div class="capture-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            </div>
            <h1>Baixe o guia gratuito</h1>
            <p><strong>5 Sinais de que é Hora de Buscar Ajuda Profissional</strong> — um guia rápido para te ajudar a reconhecer quando a terapia pode fazer diferença.</p>

            <form class="capture-form" action="https://formsubmit.co/laurabreitschaft@gmail.com" method="POST">
                <input type="text" name="name" placeholder="Seu nome" required>
                <input type="email" name="email" placeholder="Seu melhor e-mail" required>
                <input type="hidden" name="_subject" value="📥 Download do Guia - 5 Sinais">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_next" value="guia.html">
                <button type="submit">Baixar Guia Agora</button>
            </form>

            <p class="capture-privacy">Seus dados são usados apenas para envio do guia. Veja nossa <a href="politica-privacidade.html">Política de Privacidade</a>.</p>

            <a href="guia.html" class="capture-skip">Prefiro ler direto sem baixar →</a>
        </div>
    </div>
</body>

</html>
